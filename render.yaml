# Render Blueprint for Munshi's backend. Deploys server/ as a Docker web
# service. Does NOT deploy client/ -- that's a separate static-site deploy
# on Vercel; see DEPLOYMENT.md.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo. Render reads this file, provisions the service below, and prompts
# for every env var marked `sync: false` (nothing secret is ever read from
# or written to this file).
services:
  - type: web
    name: munshi-backend-sg
    env: docker
    # Singapore, not Render's default (Oregon): callers and the Sarvam/LLM APIs
    # are in India/Asia, and every audio and API round trip to Oregon added
    # ~250ms. A service's region cannot be changed after creation, so this only
    # takes effect on a NEW service -- hence the new name and a new Blueprint.
    region: singapore
    # Starter, not free: the free plan's 0.15 CPU was pinned at its limit during
    # a call (WebRTC audio + VAD + codec work), which caused choppy audio and
    # slow turns. Starter gives 0.5 CPU / 512MB.
    plan: starter
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: data/baseline_seed42
      - key: LLM_PROVIDER
        value: deepseek
      - key: JUDGE_AUTO_RUN
        value: all
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      - key: DEEPSEEK_GATEWAY_PROVIDER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: CF_TURN_TOKEN_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
